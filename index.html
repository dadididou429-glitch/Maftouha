function tr(lang, key, vars = {}) {
  let str = T[lang][key] || T.ar[key] || key;
  Object.entries(vars).forEach(([k, v]) => { str = str.replace(`{${k}}`, v); });
  return str;
}

function useNow() {
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 30000);
    return () => clearInterval(t);
  }, []);
  return now;
}

function computeStatus(ph, now) {
  const hour = now.getHours() + now.getMinutes() / 60;
  if (ph.onDuty) return { open: true, kind: "onDuty" };
  const { open, close } = ph.hours;
  const isOpen = close > 24 ? hour >= open || hour < close - 24 : hour >= open && hour < close;
  return { open: isOpen, kind: isOpen ? "closesAt" : "opensAt", time: isOpen ? close % 24 : open };
}

function fmtHour(h) {
  const hh = Math.floor(h) % 24;
  const mm = Math.round((h - Math.floor(h)) * 60);
  return String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
}

function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = ((lat2 - lat1) * Math.PI) / 180;
  const dLng = ((lng2 - lng1) * Math.PI) / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

        </div>
      )}

      {showLogin && (
        <div className="fixed inset-0 bg-black/40 flex items-end z-30" onClick={() => setShowLogin(false)}>
          <div className="bg-white w-full rounded-t-3xl p-6 max-w-md mx-auto sheet-anim" onClick={(e) => e.stopPropagation()}>
            <div className="flex justify-between items-start">
              <h2 className="text-xl font-bold">{t("adminLoginTitle")}</h2>
              <button onClick={() => setShowLogin(false)} className="text-stone-500 p-1"><X className="w-5 h-5" /></button>
            </div>
            <div className="mt-4 space-y-3">
              <input value={loginEmail} onChange={(e) => setLoginEmail(e.target.value)} dir="ltr" placeholder="admin@email.com"
                className="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500" />
              <input value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} type="password" dir="ltr" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢"
                onKeyDown={(e) => e.key === "Enter" && submitLogin()}
                className="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500" />
              {loginError && <p className="text-xs text-rose-500">{loginError}</p>}
              <button onClick={submitLogin} disabled={loginLoading}
                className="w-full bg-emerald-700 disabled:opacity-60 text-emerald-50 rounded-xl py-3 text-sm font-semibold">
                {loginLoading ? "..." : t("loginBtn")}
              </button>
            </div>
          </div>
        </div>
      )}

      {adminView && (
        <div className="fixed inset-0 bg-emerald-950 z-40 overflow-y-auto">
          <div className="max-w-md mx-auto px-5 py-6">
            <div className="flex items-center justify-between mb-1">
              <h2 className="text-xl font-bold text-emerald-50">{t("adminTitle")}</h2>
              <div className="flex items-center gap-2">
                <button onClick={logoutAdmin} className="text-xs text-rose-300 border border-rose-900 rounded-md px-2 py-1">{t("logoutBtn")}</button>
                <button onClick={() => setAdminView(false)} className="text-emerald-400 p-1"><X className="w-5 h-5" /></button>
              </div>
            </div>
            <p className="text-xs text-emerald-500 mb-4 mono" dir="ltr">{adminUser && adminUser.email}</p>

            <div className="flex gap-2 mb-5">
              <button onClick={() => setAdminTab("review")}
                className={`flex-1 text-xs font-medium rounded-lg py-2 ${adminTab === "review" ? "bg-emerald-500 text-emerald-950" : "bg-emerald-900 text-emerald-300"}`}>
                {t("reviewBtn", { n: reviewQueue.length })}
              </button>
              <button onClick={() => setAdminTab("all")}
                className={`flex-1 text-xs font-medium rounded-lg py-2 ${adminTab === "all" ? "bg-emerald-500 text-emerald-950" : "bg-emerald-900 text-emerald-300"}`}>
                {t("allPharmaciesTab", { n: allComputed.length })}
              </button>
            </div>

            {adminTab === "review" && (
              <>
                <p className="text-sm text-emerald-300 mb-4">{t("adminSubtitle", { n: COMPLAINT_THRESHOLD })}</p>
                {reviewQueue.length === 0 && <div className="text-center text-emerald-600 mt-16 text-sm">{t("adminEmpty")}</div>}
                <div className="space-y-3">
                  {reviewQueue.map((ph) => (
                    <div key={ph.id} className="bg-emerald-950 rounded-2xl p-4 border border-emerald-800">
                      <div className="flex items-start justify-between">
                        <div>
                          <h3 className="font-semibold text-emerald-50">{ph.name}</h3>
                          <p className="text-xs text-emerald-300 mt-0.5">{ph.area} Â· {ph.address}</p>
                          {ph.phone && <p className="text-xs text-emerald-300 mt-0.5 mono" dir="ltr">{ph.phone}</p>}
                        </div>
                        <div className="flex items-center gap-1 bg-rose-950 text-rose-300 text-xs font-semibold px-2.5 py-1 rounded-full flex-shrink-0">
                          <AlertTriangle className="w-3 h-3" />{ph.complaintCount}
                        </div>
                      </div>
                      <div className="flex gap-2 mt-4">
                        <button onClick={() => dismissComplaints(ph.id, ph.name)} className="flex-1 bg-emerald-900 text-emerald-400 text-sm font-medium rounded-lg py-2.5">{t("verifyReturn")}</button>
                        <button onClick={() => removePermanently(ph.id, ph.name)} className="flex-1 bg-rose-950 text-rose-300 text-sm font-medium rounded-lg py-2.5">{t("deleteFinal")}</button>
                      </div>
                    </div>
                  ))}
                </div>
              </>
            )}

            {adminTab === "all" && (
              <>
                <p className="text-sm text-emerald-300 mb-4">{t("allPharmaciesSubtitle")}</p>
                <div className="space-y-2">
                  {allComputed.map((ph) => (
                    <div key={ph.id} className="bg-emerald-950 rounded-xl p-3 border border-emerald-800 flex items-center justify-between gap-2">
                      <div className="min-w-0">
                        <p className="text-sm font-medium text-emerald-50 truncate flex items-center gap-1.5">
                          {ph.name}
                          {ph.verified === false && <span className="text-[9px] bg-amber-900 text-amber-300 rounded-full px-1.5 py-0.5 flex-shrink-0">{t("unverifiedBadge")}</span>}
                        </p>
                        <p className="text-xs text-emerald-400 truncate">{ph.area}</p>
                      </div>
                      <button onClick={() => removePermanently(ph.id, ph.name)} className="flex-shrink-0 bg-rose-950 text-rose-300 text-xs font-medium rounded-lg px-3 py-2">{t("deleteFinal")}</button>
                    </div>
                  ))}
                </div>
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PharmacyFinder />);
document.getElementById("root").dataset.mounted = "true";
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>

function tr(lang, key, vars = {}) {
  let str = T[lang][key] || T.ar[key] || key;
  Object.entries(vars).forEach(([k, v]) => { str = str.replace(`{${k}}`, v); });
  return str;
}

function useNow() {
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 30000);
    return () => clearInterval(t);
  }, []);
  return now;
}

function computeStatus(ph, now) {
  const hour = now.getHours() + now.getMinutes() / 60;
  if (ph.onDuty) return { open: true, kind: "onDuty" };
  const { open, close } = ph.hours;
  const isOpen = close > 24 ? hour >= open || hour < close - 24 : hour >= open && hour < close;
  return { open: isOpen, kind: isOpen ? "closesAt" : "opensAt", time: isOpen ? close % 24 : open };
}

function fmtHour(h) {
  const hh = Math.floor(h) % 24;
  const mm = Math.round((h - Math.floor(h)) * 60);
  return String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
}

function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = ((lat2 - lat1) * Math.PI) / 180;
  const dLng = ((lng2 - lng1) * Math.PI) / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      (pos) => setUserLoc({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      () => {},
      { timeout: 8000 }
    );
  }, []);

  const selectWilaya = (w) => {
    if (!w.enabled) {
      setToast(t("wilayaComingSoonToast", { name: w.name }));
      setTimeout(() => setToast(null), 3000);
      return;
    }
    setWilayaId(w.id);
  };

  const selectCommune = (c) => {
    setWilayaOpen(false);
    if (!c.enabled) {
      setToast(t("wilayaComingSoonToast", { name: c.name }));
      setTimeout(() => setToast(null), 3000);
      return;
    }
    setCommuneId(c.id);
  };

  const dismissComplaints = (id, name) => {
    setComplaints((prev) => ({ ...prev, [id]: 0 }));
    setToast(t("dismissedToast", { name }));
    setTimeout(() => setToast(null), 3500);
  };

  const removePermanently = (id, name) => {
    setRemovedIds((prev) => new Set(prev).add(id));
    setToast(t("removedToast", { name }));
    setTimeout(() => setToast(null), 3500);
  };

  const reportPharmacy = (id, name) => {
    if (reportedByMe.has(id)) { setToast(t("alreadyReported")); return; }
    setComplaints((prev) => {
      const next = { ...prev, [id]: (prev[id] || 0) + 1 };
      setToast(next[id] === COMPLAINT_THRESHOLD ? t("thresholdReached", { n: COMPLAINT_THRESHOLD, name }) : t("thanksReport"));
      return next;
    });
    setReportedByMe((prev) => new Set(prev).add(id));
    setTimeout(() => setToast(null), 3500);
  };

  const list = useMemo(() => {
    return RAW_PHARMACIES.filter((ph) => !removedIds.has(ph.id))

        const status = computeStatus(ph, now);
        const distance = haversine(userLoc.lat, userLoc.lng, ph.lat, ph.lng);
        const complaintCount = complaints[ph.id] || 0;
        return { ...ph, status, distance, complaintCount, underReview: complaintCount >= COMPLAINT_THRESHOLD };

      .filter((ph) => (ph.name + ph.area + ph.address).toLowerCase().includes(query.toLowerCase()))

      .filter((ph) => (filter === "urgent" ? ph.onDuty : true))
      .filter((ph) => (showReview ? true : !ph.underReview))
      .sort((a, b) => a.distance - b.distance);
  }, [now, query, filter, complaints, showReview, removedIds, userLoc]);

    return RAW_PHARMACIES.filter((ph) => !removedIds.has(ph.id))
      .map((ph) => ({ ...ph, complaintCount: complaints[ph.id] || 0 }))
      .filter((ph) => ph.complaintCount >= COMPLAINT_THRESHOLD)
      .sort((a, b) => b.complaintCount - a.complaintCount);
  }, [complaints, removedIds]);

  const reviewCount = Object.values(complaints).filter((c) => c >= COMPLAINT_THRESHOLD).length;

  const localeMap = { ar: "ar-DZ", fr: "fr-DZ", en: "en-GB" };

      <header className="sticky top-0 z-20 bg-emerald-950 text-emerald-50 px-5 pt-4 pb-5 rounded-b-2xl shadow-lg">

              <svg viewBox="0 0 24 24" className="w-4 h-4" fill="none"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6V3z" fill="#F0F4F1" /></svg>
            </div>
            <div>

            </div>
          </div>
          <div className="text-left flex items-center gap-1.5">
            <button onClick={() => setAdminView(true)} className="mono text-emerald-400 text-[10px] border border-emerald-800 rounded-md px-2 py-1 hover:bg-emerald-900 transition">{t("dashboard")}</button>

          </div>

          className={`mt-3 w-full flex items-center justify-between gap-2 rounded-xl px-3 py-2.5 border transition ${wilayaOpen ? "bg-emerald-500 border-emerald-400 text-emerald-950" : "bg-emerald-900 border-emerald-700 text-emerald-100 hover:bg-emerald-800"}`}>

          <span className={`text-xs font-semibold underline ${wilayaOpen ? "text-emerald-950" : "text-emerald-300"}`}>{t("changeWilaya")}</span>
        </button>

        <div className="flex gap-1.5 mt-2">
          {[{ code: "ar", label: "العربية" }, { code: "fr", label: "Français" }, { code: "en", label: "English" }].map((l) => (
            <button key={l.code} onClick={() => setLang(l.code)}
              className={`px-2.5 py-1 rounded-full text-xs font-medium transition ${lang === l.code ? "bg-emerald-400 text-emerald-950" : "bg-emerald-900 text-emerald-300"}`}>
              {l.label}
            </button>
          ))}
        </div>

        {wilayaOpen && (
          <div className="mt-3 bg-emerald-950 rounded-2xl p-3 max-h-80 overflow-y-auto border border-emerald-800 space-y-3">
            <div>
              <p className="text-xs text-emerald-300 px-1 pb-2">{t("wilayaLabel")}</p>
              <div className="grid grid-cols-2 gap-1">
                {WILAYAS.map((w) => (
                  <button key={w.id} onClick={() => selectWilaya(w)}
                    className={`text-right text-xs px-2.5 py-1.5 rounded-lg flex items-center justify-between gap-1 transition ${w.id === wilayaId ? "bg-emerald-500 text-emerald-950 font-medium" : w.enabled ? "text-emerald-200 hover:bg-emerald-900" : "text-emerald-600"}`}>
                    <span className="truncate">{w.name}</span>
                    {!w.enabled && <span className="text-[9px] flex-shrink-0 opacity-70">{t("comingSoon")}</span>}
                  </button>
                ))}
              </div>
            </div>
            <div className="pt-3 border-t border-emerald-800">
              <p className="text-xs text-emerald-300 px-1 pb-2">{t("communeLabel")}</p>
              <div className="grid grid-cols-2 gap-1">
                {COMMUNES.map((c) => (
                  <button key={c.id} onClick={() => selectCommune(c)}
                    className={`text-right text-xs px-2.5 py-1.5 rounded-lg flex items-center justify-between gap-1 transition ${c.id === communeId ? "bg-emerald-500 text-emerald-950 font-medium" : c.enabled ? "text-emerald-200 hover:bg-emerald-900" : "text-emerald-600"}`}>
                    <span className="truncate">{c.name}</span>
                    {!c.enabled && <span className="text-[9px] flex-shrink-0 opacity-70">{t("comingSoon")}</span>}
                  </button>
                ))}
              </div>
            </div>
          </div>
        )}

        <div className="mt-3 flex items-baseline gap-2">
          <span className="text-3xl font-bold mono text-emerald-400">{openCount}</span>
          <span className="text-xs text-emerald-200">{t("openStat", { total: list.length })}</span>
        </div>

        <div className="mt-3 relative">
          <Search className="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-stone-500" />
          <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder={t("searchPlaceholder")}
            className="w-full bg-emerald-900 placeholder-stone-500 text-emerald-50 rounded-xl pr-10 pl-4 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-500 transition" />
        </div>

        <div className="flex gap-2 mt-2 flex-wrap">
          <button onClick={() => setFilter("all")} className={`px-3 py-1 rounded-full text-xs font-medium transition ${filter === "all" ? "bg-emerald-500 text-emerald-950" : "bg-emerald-900 text-emerald-200"}`}>{t("filterAll")}</button>
          <button onClick={() => setFilter("urgent")} className={`px-3 py-1 rounded-full text-xs font-bold transition ${filter === "urgent" ? "bg-rose-500 text-white" : "bg-rose-950 text-rose-300"}`}>{t("filterUrgent")}</button>
          <button onClick={() => setFilter("open")} className={`px-3 py-1 rounded-full text-xs font-medium transition ${filter === "open" ? "bg-emerald-500 text-emerald-950" : "bg-emerald-900 text-emerald-200"}`}>{t("filterOpen")}</button>
          {reviewCount > 0 && (
            <button onClick={() => setShowReview((s) => !s)} className={`mr-auto px-2.5 py-1 rounded-full text-xs font-medium transition flex items-center gap-1 ${showReview ? "bg-rose-500 text-white" : "bg-emerald-900 text-rose-300"}`}>
              <AlertTriangle className="w-3 h-3" />{t("reviewBtn", { n: reviewCount })}
            </button>
          )}
        </div>
      </header>

      {toast && <div className="fixed top-4 left-1/2 -translate-x-1/2 z-40 bg-emerald-950 text-emerald-50 text-sm px-4 py-2.5 rounded-full shadow-lg max-w-[90%] text-center">{toast}</div>}

      <main className="px-5 py-5 space-y-3 max-w-md mx-auto">
        {list.length === 0 && <p className="text-center text-stone-500 mt-10">{t("noResults")}</p>}
        {list.map((ph) => (
          <div key={ph.id} className={`w-full bg-white rounded-2xl p-4 shadow-sm border transition ${ph.underReview ? "border-rose-300 bg-rose-50" : "border-stone-200 hover:shadow-md"}`}>
            {ph.underReview && (
              <div className="flex items-center gap-1.5 text-xs font-medium text-rose-500 mb-2 bg-rose-50 rounded-lg px-2.5 py-1.5">
                <AlertTriangle className="w-3.5 h-3.5 flex-shrink-0" />{t("underReviewBanner", { n: ph.complaintCount })}
              </div>
            )}
            <div className="flex items-center gap-3">
              <button onClick={() => setSelected(ph)} className="flex-1 min-w-0 text-right flex items-center gap-3">
                <div className={`relative w-3 h-3 rounded-full pulse-dot flex-shrink-0 ${ph.status.open ? "text-emerald-500 bg-emerald-500" : "text-rose-500 bg-rose-500"}`} />
                <div className="flex-1 min-w-0">
                  <div className="flex items-center justify-between">
                    <h3 className="font-semibold text-stone-900 truncate">{ph.name}</h3>
                    <span className="mono text-xs text-stone-500 flex-shrink-0 mr-2">{ph.distance.toFixed(1)} {lang === "ar" ? "كم" : "km"}</span>
                  </div>
                  <p className="text-xs text-stone-500 mt-0.5">{ph.area} · {ph.address}</p>
                  <p className={`text-xs font-medium mt-1 ${ph.status.open ? "text-emerald-700" : "text-rose-500"}`}>
                    {ph.status.open ? t("openNow") : t("closedNow")} · {statusLabel(ph.status)}
                  </p>
                </div>
              </button>
              <button onClick={() => reportPharmacy(ph.id, ph.name)} title={t("reportTitle")} className="flex-shrink-0 p-2 rounded-full text-stone-400 hover:bg-rose-50 hover:text-rose-500 transition">
                <Flag className="w-4 h-4" />
              </button>
            </div>
          </div>
        ))}
      </main>

      {selected && (
        <div className="fixed inset-0 bg-black/40 flex items-end z-30" onClick={() => setSelected(null)}>
          <div className="bg-white w-full rounded-t-3xl p-6 max-w-md mx-auto sheet-anim" onClick={(e) => e.stopPropagation()}>
            <div className="flex justify-between items-start">
              <div>
                <h2 className="text-xl font-bold">{selected.name}</h2>
                <p className="text-sm text-stone-500 mt-0.5">{selected.area}</p>
              </div>
              <button onClick={() => setSelected(null)} className="text-stone-500"><X className="w-5 h-5" /></button>
            </div>
            <div className={`inline-flex items-center gap-1.5 mt-3 px-3 py-1 rounded-full text-sm font-medium ${selected.status.open ? "bg-emerald-50 text-emerald-700" : "bg-rose-50 text-rose-500"}`}>
              <span className={`w-2 h-2 rounded-full ${selected.status.open ? "bg-emerald-500" : "bg-rose-500"}`} />
              {selected.status.open ? t("openNow") : t("closedNowFull")}
            </div>
            <div className="mt-4 space-y-3 text-sm">
              <div className="flex items-center gap-2 text-stone-900"><MapPin className="w-4 h-4 text-stone-500" />{selected.address}</div>
              <div className="flex items-center gap-2 text-stone-900 mono"><Navigation className="w-4 h-4 text-stone-500" />{selected.distance.toFixed(1)} {lang === "ar" ? "كم عنك" : "km away"}</div>
              <div className="flex items-center gap-2 text-stone-900"><Clock className="w-4 h-4 text-stone-500" />{statusLabel(selected.status)}</div>
              {selected.phone && <div className="flex items-center gap-2 text-stone-900 mono"><Phone className="w-4 h-4 text-stone-500" /><span dir="ltr">{selected.phone}</span></div>}
            </div>
            {selected.underReview && (
              <div className="flex items-start gap-2 text-xs text-rose-500 mt-4 bg-rose-50 rounded-lg px-3 py-2.5">
                <AlertTriangle className="w-4 h-4 flex-shrink-0 mt-0.5" />{t("underReviewDetail", { n: selected.complaintCount })}
              </div>
            )}
            <div className="flex gap-2 mt-5">
              <a href={`https://www.google.com/maps/dir/?api=1&destination=${selected.lat},${selected.lng}`} target="_blank" rel="noopener noreferrer"
                className="flex-1 bg-emerald-950 text-emerald-50 rounded-xl py-3 font-medium text-center">{t("directions")}</a>
              <button onClick={() => reportPharmacy(selected.id, selected.name)} className="px-4 rounded-xl border border-stone-200 text-rose-500 flex items-center justify-center" title={t("reportTitle")}>
                <Flag className="w-4 h-4" />
              </button>
            </div>
          </div>
        </div>
      )}

      {adminView && (
        <div className="fixed inset-0 bg-emerald-950 z-40 overflow-y-auto">
          <div className="max-w-md mx-auto px-5 py-6">
            <div className="flex items-center justify-between mb-1">
              <h2 className="text-xl font-bold text-emerald-50">{t("adminTitle")}</h2>
              <button onClick={() => setAdminView(false)} className="text-emerald-400 p-1"><X className="w-5 h-5" /></button>
            </div>
            <p className="text-sm text-emerald-300 mb-6">{t("adminSubtitle", { n: COMPLAINT_THRESHOLD })}</p>
            {reviewQueue.length === 0 && <div className="text-center text-emerald-600 mt-16 text-sm">{t("adminEmpty")}</div>}
            <div className="space-y-3">
              {reviewQueue.map((ph) => (
                <div key={ph.id} className="bg-emerald-950 rounded-2xl p-4 border border-emerald-800">
                  <div className="flex items-start justify-between">
                    <div>
                      <h3 className="font-semibold text-emerald-50">{ph.name}</h3>
                      <p className="text-xs text-emerald-300 mt-0.5">{ph.area} · {ph.address}</p>
                      {ph.phone && <p className="text-xs text-emerald-300 mt-0.5 mono" dir="ltr">{ph.phone}</p>}
                    </div>
                    <div className="flex items-center gap-1 bg-rose-950 text-rose-300 text-xs font-semibold px-2.5 py-1 rounded-full flex-shrink-0">
                      <AlertTriangle className="w-3 h-3" />{ph.complaintCount}
                    </div>
                  </div>
                  <div className="flex gap-2 mt-4">
                    <button onClick={() => dismissComplaints(ph.id, ph.name)} className="flex-1 bg-emerald-900 text-emerald-400 text-sm font-medium rounded-lg py-2.5">{t("verifyReturn")}</button>
                    <button onClick={() => removePermanently(ph.id, ph.name)} className="flex-1 bg-rose-950 text-rose-300 text-sm font-medium rounded-lg py-2.5">{t("deleteFinal")}</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PharmacyFinder />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>

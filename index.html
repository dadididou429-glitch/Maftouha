const submitRating=()=>{if(!draftStars)return showToast(t("pickStarsFirst"));setRatings(x=>{const old=x[selected.id]||{sum:0,count:0},mine=myReviews[selected.id];return{...x,[selected.id]:{sum:mine?old.sum-mine.stars+draftStars:old.sum+draftStars,count:mine?old.count:old.count+1}}});setMyReviews(x=>({...x,[selected.id]:{stars:draftStars,text:draftText}}));showToast(t("reviewSubmitted"))};
const capture=()=>navigator.geolocation?.getCurrentPosition(p=>{setFormLoc({lat:p.coords.latitude,lng:p.coords.longitude});setFormLocStatus("ok")},()=>setFormLocStatus("failed"),{timeout:8000});
const submitPharmacy=async()=>{if(!formName.trim()||!formAddress.trim())return showToast(t("formRequiredError"));const loc=formLoc||userLoc;try{const payload={name:formName.trim(),area:formArea.trim(),address:formAddress.trim(),phone:formPhone.trim()||null,lat:loc.lat,lng:loc.lng,wilaya:wilaya.name,hours:{open:Number(formOpen),close:Number(formClose)},onDuty:formDuty,verified:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()};const ref=await db.collection("pharmacies_submitted").add(payload);setSubmitted(x=>[...x,{id:ref.id,...payload}]);showToast(t("newPharmacySuccess"));setShowAdd(false);setFormName("");setFormArea("");setFormAddress("");setFormPhone("")}catch(e){showToast(t("newPharmacyError"))}};
const login=async()=>{try{await auth.signInWithEmailAndPassword(loginEmail.trim(),loginPassword);setShowLogin(false);setAdminView(true)}catch(e){setLoginError(t("loginError"))}};

return <div dir={dir} className="min-h-screen bg-emerald-50 text-stone-900" style={{fontFamily:lang==="ar"?"'IBM Plex Sans Arabic',sans-serif":"'IBM Plex Sans',sans-serif"}}>
<header className="sticky top-0 z-20 bg-emerald-950 text-emerald-50 px-5 pt-4 pb-5 rounded-b-2xl shadow-lg">
<div className="flex items-center justify-between"><div><h1 className="text-xl font-bold text-emerald-400" dir="ltr">Pharis</h1><p className="text-xs text-emerald-300">{commune.name}</p></div><button onClick={()=>adminUser?setAdminView(true):setShowLogin(true)} className="mono text-emerald-400 text-[10px] border border-emerald-800 rounded-md px-2 py-1">{t("dashboard")}</button></div>
<button onClick={()=>setWilayaOpen(x=>!x)} className="mt-3 w-full flex items-center justify-between rounded-xl px-3 py-2.5 bg-emerald-900 border border-emerald-700"><span className="flex items-center gap-2 text-sm"><MapPin className="w-4 h-4"/>{t("tagline",{wilaya:wilaya.name})}</span><span className="text-xs text-emerald-300 underline">{t("changeWilaya")}</span></button>
<div className="flex gap-1.5 mt-2">{[["ar","العربية"],["fr","Français"],["en","English"]].map(x=><button key={x[0]} onClick={()=>setLang(x[0])} className={`px-2.5 py-1 rounded-full text-xs ${lang===x[0]?"bg-emerald-400 text-emerald-950":"bg-emerald-900 text-emerald-300"}`}>{x[1]}</button>)}</div>
{wilayaOpen&&<div className="mt-3 bg-emerald-950 rounded-2xl p-3 border border-emerald-800"><p className="text-xs text-emerald-300 mb-2">{t("wilayaLabel")}</p><div className="grid grid-cols-2 gap-1">{WILAYAS.map(w=><button key={w.id} disabled={!w.enabled} className={`text-right text-xs px-2.5 py-1.5 rounded-lg ${w.enabled?"text-emerald-200 hover:bg-emerald-900":"text-emerald-700"}`}>{w.name}{!w.enabled&&<span className="text-[9px] mr-1">({t("comingSoon")})</span>}</button>)}</div></div>}
<div className="mt-3 flex items-baseline gap-2"><span className="text-3xl font-bold mono text-emerald-400">{openCount}</span><span className="text-xs text-emerald-200">{t("openStat",{total:list.length})}</span></div>
<div className="mt-3 relative"><Search className="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-stone-500"/><input value={query} onChange={e=>setQuery(e.target.value)} placeholder={t("searchPlaceholder")} className="w-full bg-emerald-900 placeholder-stone-500 text-emerald-50 rounded-xl pr-10 pl-4 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-500"/></div>
<div className="flex gap-2 mt-2 flex-wrap"><button onClick={()=>setFilter("all")} className={`px-3 py-1 rounded-full text-xs ${filter==="all"?"bg-emerald-500 text-emerald-950":"bg-emerald-900 text-emerald-200"}`}>{t("filterAll")}</button><button onClick={()=>setFilter("urgent")} className={`px-3 py-1 rounded-full text-xs ${filter==="urgent"?"bg-rose-500 text-white":"bg-rose-950 text-rose-300"}`}>{t("filterUrgent")}</button><button onClick={()=>setFilter("open")} className={`px-3 py-1 rounded-full text-xs ${filter==="open"?"bg-emerald-500 text-emerald-950":"bg-emerald-900 text-emerald-200"}`}>{t("filterOpen")}</button><button onClick={()=>setFilter("favorites")} className={`px-3 py-1 rounded-full text-xs flex items-center gap-1 ${filter==="favorites"?"bg-emerald-500 text-emerald-950":"bg-emerald-900 text-emerald-200"}`}><Heart className="w-3 h-3"/>{t("filterFavorites")}</button><button onClick={()=>setShowAdd(true)} className="mr-auto px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-400 text-emerald-950">+ {t("addPharmacyBtn")}</button></div>
</header>
{toast&&<div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-emerald-950 text-white text-sm px-4 py-2.5 rounded-full shadow-lg max-w-[90%] text-center">{toast}</div>}
<main className="px-5 py-5 space-y-3 max-w-md mx-auto">{list.length===0&&<p className="text-center text-stone-500 mt-10">{filter==="favorites"?t("noFavorites"):t("noResults")}</p>}
{list.map(ph=><div key={ph.id} className="w-full bg-white rounded-2xl p-4 shadow-sm border border-stone-200"><div className="flex items-center gap-3"><button onClick={()=>setSelected(ph)} className="flex-1 min-w-0 text-right flex items-center gap-3"><div className={`relative w-3 h-3 rounded-full pulse-dot flex-shrink-0 ${ph.status.open?"text-emerald-500 bg-emerald-500":"text-rose-500 bg-rose-500"}`}/><div className="flex-1 min-w-0"><div className="flex justify-between"><h3 className="font-semibold truncate">{ph.name}</h3><span className="mono text-xs text-stone-500 mr-2">{ph.distance.toFixed(1)} كم</span></div><p className="text-xs text-stone-500 mt-0.5">{ph.area} · {ph.address}</p><p className={`text-xs font-medium mt-1 ${ph.status.open?"text-emerald-700":"text-rose-500"}`}>{ph.status.open?t("openNow"):t("closedNow")} · {ph.status.kind==="onDuty"?t("onDutyLabel"):t(ph.status.kind,{time:fmt(ph.status.time)})}</p></div></button><button onClick={()=>setFavorites(x=>{const n=new Set(x);n.has(ph.id)?n.delete(ph.id):n.add(ph.id);return n})} className={ph.isFavorite?"text-rose-500":"text-stone-400"}><Heart className="w-5 h-5" fill={ph.isFavorite?"currentColor":"none"}/></button></div></div>)}</main>

{selected&&<div className="fixed inset-0 bg-black/40 flex items-end z-30" onClick={()=>setSelected(null)}><div className="bg-white w-full rounded-t-3xl p-6 max-w-md mx-auto sheet-anim" onClick={e=>e.stopPropagation()}><div className="flex justify-between"><div><h2 className="text-xl font-bold">{selected.name}</h2><p className="text-sm text-stone-500">{selected.area}</p></div><button onClick={()=>setSelected(null)}><X className="w-5 h-5"/></button></div><div className={`inline-flex mt-3 px-3 py-1 rounded-full text-sm ${selected.status.open?"bg-emerald-50 text-emerald-700":"bg-rose-50 text-rose-500"}`}>{selected.status.open?t("openNow"):t("closedNow")}</div><div className="mt-4 space-y-3 text-sm"><div className="flex gap-2"><MapPin className="w-4 h-4"/>{selected.address}</div><div className="flex gap-2"><Navigation className="w-4 h-4"/>{selected.distance.toFixed(1)} كم</div><div className="flex gap-2"><Clock className="w-4 h-4"/>{selected.status.kind==="onDuty"?t("onDutyLabel"):t(selected.status.kind,{time:fmt(selected.status.time)})}</div>{selected.phone&&<div className="flex gap-2"><Phone className="w-4 h-4"/><span dir="ltr">{selected.phone}</span></div>}</div>
<div className="mt-5 pt-4 border-t"><div className="flex justify-between"><h3 className="text-sm font-semibold">{t("reviewsTitle")}</h3>{selected.rating.count?<span className="text-sm text-amber-600">★ {(selected.rating.sum/selected.rating.count).toFixed(1)} {t("ratingsCount",{n:selected.rating.count})}</span>:<span className="text-xs text-stone-400">{t("noRatingsYet")}</span>}</div><p className="text-xs text-stone-500 mt-3">{t("yourRating")}</p><div className="flex gap-1">{[1,2,3,4,5].map(n=><button key={n} onClick={()=>setDraftStars(n)}><Star className={`w-6 h-6 ${n<=draftStars?"text-amber-500":"text-stone-200"}`} fill={n<=draftStars?"currentColor":"none"}/></button>)}</div><textarea value={draftText} onChange={e=>setDraftText(e.target.value)} placeholder={t("reviewPlaceholder")} rows="2" className="w-full mt-2 bg-stone-50 border rounded-xl px-3 py-2 text-sm resize-none"/><button onClick={submitRating} className="mt-2 w-full bg-emerald-700 text-white rounded-xl py-2 text-sm">{t("submitReview")}</button></div>
<div className="flex gap-2 mt-5"><a href={`https://www.google.com/maps/dir/?api=1&destination=${selected.lat},${selected.lng}`} target="_blank" rel="noopener noreferrer" className="flex-1 bg-emerald-950 text-white rounded-xl py-3 text-center">{t("directions")}</a><button onClick={()=>showToast(t("thanksReport"))} className="px-4 rounded-xl border text-rose-500"><Flag className="w-4 h-4"/></button></div></div></div>}

{showAdd&&<div className="fixed inset-0 bg-black/40 flex items-end z-30" onClick={()=>setShowAdd(false)}><div className="bg-white w-full rounded-t-3xl p-6 max-w-md mx-auto max-h-[90vh] overflow-y-auto" onClick={e=>e.stopPropagation()}><div className="flex justify-between"><div><h2 className="text-xl font-bold">{t("addPharmacyTitle")}</h2></div><button onClick={()=>setShowAdd(false)}><X className="w-5 h-5"/></button></div><div className="mt-4 space-y-3">{[[t("formName"),formName,setFormName],[t("formArea"),formArea,setFormArea],[t("formAddress"),formAddress,setFormAddress],[t("formPhone"),formPhone,setFormPhone]].map((x,i)=><div key={i}><label className="text-xs text-stone-500">{x[0]}</label><input value={x[1]} onChange={e=>x[2](e.target.value)} className="w-full bg-stone-50 border rounded-xl px-3 py-2.5 text-sm"/></div>)}<label className="flex gap-2 text-sm"><input type="checkbox" checked={formDuty} onChange={e=>setFormDuty(e.target.checked)}/>{t("formOnDuty")}</label>{!formDuty&&<div className="grid grid-cols-2 gap-3"><input type="number" value={formOpen} onChange={e=>setFormOpen(e.target.value)} className="border rounded-xl p-2" placeholder={t("formOpenHour")}/><input type="number" value={formClose} onChange={e=>setFormClose(e.target.value)} className="border rounded-xl p-2" placeholder={t("formCloseHour")}/></div>}<button onClick={capture} className="w-full border rounded-xl py-2.5">{formLocStatus==="ok"?t("locationCaptured"):t("useMyLocation")}</button>{formLocStatus==="failed"&&<p className="text-xs text-rose-500">{t("locationFailed")}</p>}<button onClick={submitPharmacy} className="w-full bg-emerald-700 text-white rounded-xl py-3">{t("submitNewPharmacy")}</button></div></div></div>}

{showLogin&&<div className="fixed inset-0 bg-black/40 flex items-end z-30" onClick={()=>setShowLogin(false)}><div className="bg-white w-full rounded-t-3xl p-6 max-w-md mx-auto" onClick={e=>e.stopPropagation()}><div className="flex justify-between"><h2 className="text-xl font-bold">{t("adminLoginTitle")}</h2><button onClick={()=>setShowLogin(false)}><X className="w-5 h-5"/></button></div><div className="mt-4 space-y-3"><input value={loginEmail} onChange={e=>setLoginEmail(e.target.value)} dir="ltr" placeholder="admin@email.com" className="w-full border rounded-xl px-3 py-2.5"/><input value={loginPassword} onChange={e=>setLoginPassword(e.target.value)} type="password" dir="ltr" className="w-full border rounded-xl px-3 py-2.5"/>{loginError&&<p className="text-xs text-rose-500">{loginError}</p>}<button onClick={login} className="w-full bg-emerald-700 text-white rounded-xl py-3">{t("loginBtn")}</button></div></div></div>}

{adminView&&<div className="fixed inset-0 bg-emerald-950 z-40 overflow-y-auto"><div className="max-w-md mx-auto p-6 text-white"><div className="flex justify-between"><h2 className="text-xl font-bold">{t("adminTitle")}</h2><div className="flex gap-2"><button onClick={()=>{auth.signOut();setAdminView(false)}} className="text-xs text-rose-300">{t("logoutBtn")}</button><button onClick={()=>setAdminView(false)}><X className="w-5 h-5"/></button></div></div><p className="text-sm text-emerald-300 mt-4">{t("allPharmaciesTab",{n:all.length})}</p><div className="space-y-2 mt-4">{all.map(ph=><div key={ph.id} className="bg-emerald-900 rounded-xl p-3 flex justify-between gap-2"><div><p className="font-medium">{ph.name}</p><p className="text-xs text-emerald-300">{ph.area}</p></div><button onClick={async()=>{try{if(typeof ph.id==="string")await db.collection("pharmacies_submitted").doc(ph.id).delete();else await db.collection("removed_pharmacies").doc(String(ph.id)).set({name:ph.name});setRemoved(x=>new Set(x).add(ph.id));}catch(e){}}} className="text-xs text-rose-300">{t("deleteFinal")}</button></div>)}</div></div></div>}
</div>
}

ReactDOM.createRoot(document.getElementById("root")).render(<PharmacyFinder/>);
</script>

<script>
if ("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js").catch(()=>{}));
</script>
</body>
</html>
